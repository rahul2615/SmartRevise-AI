{% extends 'base.html' %}

{% block title %}403 Forbidden - SmartRevise AI{% endblock %}

{% block content %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh">
    <div class="text-center fade-in">
        <div class="mb-4">
            <i class="fas fa-shield-alt fa-5x text-danger opacity-50"></i>
        </div>
        <h1 class="fw-bold mb-2" style="font-size: 4rem; color: var(--bs-danger)">403</h1>
        <h3 class="fw-semibold mb-3">Access Denied</h3>
        <p class="text-muted mb-4" style="max-width: 420px; margin: 0 auto">
            You don't have permission to access this page. 
            This area requires a higher privilege level.
        </p>
        <div class="d-flex gap-3 justify-content-center">
            <a href="{{ url_for('dashboard') }}" class="btn btn-primary px-4">
                <i class="fas fa-home me-2"></i>Dashboard
            </a>
            <a href="javascript:history.back()" class="btn btn-outline-secondary px-4">
                <i class="fas fa-arrow-left me-2"></i>Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
